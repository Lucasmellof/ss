apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ss.fullname" . }}
  labels:
    {{- include "ss.labels" . | nindent 4 }}
data:
  MAX_VIEWERS: {{ .Values.config.maxViewers | quote }}
  MAX_PUBLISHERS: {{ .Values.config.maxPublishers | quote }}
  WS_RATE_LIMIT: {{ .Values.config.wsRateLimit | quote }}
  MAX_WS_PER_IP: {{ .Values.config.maxWSPerIP | quote }}
  TRUSTED_PROXIES: {{ .Values.config.trustedProxies | quote }}
  {{- if include "ss.singlePort" . }}
  UDP_PORT: {{ .Values.media.udpPort | quote }}
  {{- else }}
  UDP_MIN: {{ .Values.media.udpMin | quote }}
  UDP_MAX: {{ .Values.media.udpMax | quote }}
  {{- end }}
