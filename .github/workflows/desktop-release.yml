name: Desktop release

on:
  push:
    tags: ["v*"]

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match desktop/package.json version
        run: |
          pkg="$(node -p "require('./desktop/package.json').version")"
          if [ "v$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "A tag ${GITHUB_REF_NAME} não bate com a versão $pkg do desktop/package.json"
            exit 1
          fi

  build-windows:
    needs: check-version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bun install --frozen-lockfile
      # Gera o helper de áudio (Go), a interface, o exe portable e o instalador. Sem assinatura.
      - run: bun run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/artifacts/electron-builder-release/ScreenShare-*-portable.exe
            desktop/artifacts/electron-builder-release/ScreenShare-Setup-*.exe
            desktop/artifacts/electron-builder-release/ScreenShare-Setup-*.exe.blockmap
            desktop/artifacts/electron-builder-release/latest.yml
          if-no-files-found: error

  build-linux:
    needs: check-version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            desktop/artifacts/electron-builder-release/ScreenShare-*.AppImage
            desktop/artifacts/electron-builder-release/ScreenShare-*.deb
          if-no-files-found: error

  build-macos:
    needs: check-version
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Configure code signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No signing certificate configured; building an unsigned app."
          fi
      - run: bun run dist:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            desktop/artifacts/electron-builder-release/ScreenShare-*.dmg
            desktop/artifacts/electron-builder-release/ScreenShare-*.zip
            desktop/artifacts/electron-builder-release/latest-mac.yml
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Se a release da tag já existe (ex.: tag recriada com force push), sobrescreve os arquivos.
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
